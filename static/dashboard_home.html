<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Businesses — Nexus Voice</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0f1117; color: #e6e6ec; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; border-bottom: 1px solid #232634; padding-bottom: 18px; }
header h1 { margin: 0; font-size: 1.4rem; }
header h1 .accent { color: #5ac8fa; }
header .user { color: #8a8f9c; font-size: 0.9rem; text-align: right; }
header .user .name { color: #e6e6ec; font-weight: 600; }
header .user .role { color: #8a8f9c; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }

.intro { color: #8a8f9c; margin-bottom: 24px; font-size: 0.95rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

.card {
    background: #16181f; border: 1px solid #232634; border-radius: 10px;
    padding: 20px; transition: border-color .15s, transform .15s;
    cursor: pointer; text-decoration: none; color: inherit; display: block;
}
.card:hover { border-color: #5ac8fa; transform: translateY(-2px); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card h2 { margin: 0; font-size: 1.1rem; }
.card .agent { font-family: ui-monospace, Menlo, monospace; color: #8a8f9c; font-size: 0.75rem; margin-top: 4px; }
.card .last { color: #8a8f9c; font-size: 0.78rem; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.s { background: #1a1d27; border-radius: 6px; padding: 8px 10px; text-align: center; }
.s .v { font-size: 1.1rem; font-weight: 700; }
.s .l { font-size: 0.65rem; text-transform: uppercase; color: #8a8f9c; letter-spacing: 0.05em; margin-top: 2px; }
.s.lead .v { color: #3ddc97; }
.s.spam .v { color: #ff6b6b; }
.s.review .v { color: #ffb84d; }

.totals { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid #232634; font-size: 0.85rem; color: #8a8f9c; }
.totals .cost { color: #e6e6ec; font-weight: 600; }
.totals .credits { color: #8a8f9c; font-size: 0.75rem; }

.empty { padding: 60px 20px; text-align: center; color: #8a8f9c; }
.error { padding: 20px; background: #3a1f24; border: 1px solid #5a2a30; border-radius: 8px; color: #ff8b8b; }

.muted-link { color: #5ac8fa; text-decoration: none; }
.muted-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
<header>
    <h1>My <span class="accent">Businesses</span></h1>
    <div class="user">
        <div class="name" id="userName">…</div>
        <div class="role"><span id="userRole">…</span> · <a href="#" id="logout" style="color:#8a8f9c">logout</a></div>
    </div>
</header>

<p class="intro">
    Each card below is one business / configured AI agent.
    Click a card to see all the calls that agent handled.
</p>

<div id="content"></div>
</div>

<script>
function fmtDateTime(iso) {
    if (!iso) return 'no calls yet';
    try { return new Date(iso).toLocaleString(); } catch { return iso; }
}
function fmtDuration(seconds) {
    if (!seconds) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchJsonAuth(url) {
    const resp = await fetch(url, { credentials: 'same-origin' });
    if (resp.status === 401) {
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
        throw new Error('redirecting to login');
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp.json();
}

async function loadMe() {
    try {
        const me = await fetchJsonAuth('/api/auth/me');
        document.getElementById('userName').textContent = me.name || me.email;
        document.getElementById('userRole').textContent = (me.role || 'owner') + (me.email ? ' · ' + me.email : '');
    } catch (e) { /* redirect already started */ }
}

document.getElementById('logout').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
    window.location.href = '/login';
});

async function load() {
    try {
        const data = await fetchJsonAuth('/api/businesses');
        render(data.businesses || []);
    } catch (e) {
        if (e.message !== 'redirecting to login') {
            document.getElementById('content').innerHTML = `<div class="error">Failed to load: ${e.message}</div>`;
        }
    }
}

loadMe();

function render(list) {
    if (list.length === 0) {
        document.getElementById('content').innerHTML = `<div class="empty">No businesses yet. Create a tenant under <code>src/tenants/</code> and make a test call.</div>`;
        return;
    }

    document.getElementById('content').innerHTML = `<div class="grid">${list.map(b => {
        const name = escapeHtml(b.name || b.tenant_id);
        const agent = escapeHtml(b.agent_id || '—');
        const lastCall = b.last_call_at ? fmtDateTime(b.last_call_at) : 'no calls yet';
        const cost = `$${(b.total_cost_usd || 0).toFixed(2)}`;
        const credits = b.total_cost || 0;
        const totalDur = fmtDuration(b.total_duration_s || 0);
        return `
            <a class="card" href="/dashboard/${encodeURIComponent(b.tenant_id)}">
                <div class="card-head">
                    <div>
                        <h2>${name}</h2>
                        <div class="agent">${agent}</div>
                    </div>
                    <div class="last">last: ${lastCall}</div>
                </div>
                <div class="stats-row">
                    <div class="s"><div class="v">${b.total_calls || 0}</div><div class="l">Calls</div></div>
                    <div class="s lead"><div class="v">${b.leads || 0}</div><div class="l">Leads</div></div>
                    <div class="s spam"><div class="v">${b.spam || 0}</div><div class="l">Spam</div></div>
                    <div class="s review"><div class="v">${b.needs_review || 0}</div><div class="l">Review</div></div>
                </div>
                <div class="totals">
                    <div>
                        <div class="cost">${cost}</div>
                        <div class="credits">${credits.toLocaleString()} credits · ${totalDur} talk</div>
                    </div>
                    <span class="muted-link">open →</span>
                </div>
            </a>
        `;
    }).join('')}</div>`;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
