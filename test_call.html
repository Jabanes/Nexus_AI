<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Voice Engine — Test Client</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #16161e;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid #2a2a3a;
        }
        h1 { margin-top: 0; font-size: 1.4rem; }
        h2 { margin-top: 0; font-size: 1.1rem; color: #888; }

        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 4px; }
        select, input {
            padding: 8px 12px;
            background: #1e1e2e;
            color: #fff;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; }
        button {
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .green { background: #22c55e; color: #000; }
        .red { background: #ef4444; color: #fff; }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #555;
        }
        .status-dot.connected { background: #22c55e; }
        .status-dot.connecting { background: #eab308; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .meter-container { display: flex; align-items: center; margin: 8px 0; }
        .meter-label { width: 80px; font-size: 0.85rem; color: #888; }
        .meter-bar-bg {
            flex-grow: 1; height: 6px;
            background: #1e1e2e; border-radius: 3px; overflow: hidden;
        }
        .meter-bar-fill {
            height: 100%; width: 0%;
            transition: width 0.1s;
            border-radius: 3px;
        }
        #mic-fill { background: #38bdf8; }
        #spk-fill { background: #c084fc; }

        #transcript {
            min-height: 120px; max-height: 300px;
            overflow-y: auto;
            background: #0d0d14;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .t-user { color: #38bdf8; }
        .t-agent { color: #a78bfa; }
        .t-system { color: #666; font-style: italic; }

        #logs {
            height: 200px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
        }
        .log-rx { color: #4ade80; }
        .log-tx { color: #38bdf8; }
        .log-err { color: #f87171; }
        .log-info { color: #fbbf24; }

        #stats {
            color: #666;
            font-family: monospace;
            font-size: 12px;
            margin-top: 8px;
        }
        details { margin-top: 12px; }
        summary { cursor: pointer; color: #888; font-size: 0.85rem; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Nexus Voice Engine</h1>
        <h2>Test Client</h2>

        <label>Tenant</label>
        <select id="tenantSelect">
            <option value="">Loading...</option>
        </select>

        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="status">Disconnected</span>
        </div>

        <div class="meter-container">
            <span class="meter-label">Mic</span>
            <div class="meter-bar-bg"><div id="mic-fill" class="meter-bar-fill"></div></div>
        </div>
        <div class="meter-container">
            <span class="meter-label">Speaker</span>
            <div class="meter-bar-bg"><div id="spk-fill" class="meter-bar-fill"></div></div>
        </div>

        <div class="btn-row">
            <button id="btnConnect" class="green" onclick="startCall()">Start Call</button>
            <button id="btnDisconnect" class="red" onclick="stopCall()" disabled>Stop Call</button>
        </div>
    </div>

    <div class="card">
        <label>Conversation</label>
        <div id="transcript">
            <div class="t-system">Press "Start Call" to begin...</div>
        </div>
    </div>

    <details>
        <summary>Debug Logs</summary>
        <div id="logs"></div>
        <div id="stats">Waiting...</div>
    </details>

    <script>
        // ============================================================
        // GLOBAL ERROR HANDLER — prevent page crashes
        // ============================================================
        window.onerror = (msg, src, line, col, err) => {
            console.error('[GLOBAL ERROR]', msg, src, line, col, err);
            return true; // prevent default
        };
        window.onunhandledrejection = (e) => {
            console.error('[UNHANDLED PROMISE]', e.reason);
            e.preventDefault();
        };

        // ============================================================
        // STATE
        // ============================================================
        const ELEVENLABS_SAMPLE_RATE = 16000;
        let ws = null;
        let audioCtx = null;
        let mediaStream = null;
        let recorder = null;
        let nextPlayTime = 0;  // for gapless scheduling

        let stats = {
            binaryMsgsRx: 0, binaryBytesRx: 0, textMsgsRx: 0,
            audioChunksTx: 0, pcmChunksPlayed: 0, playErrors: 0,
        };

        // ============================================================
        // UI HELPERS
        // ============================================================
        const logDiv = document.getElementById('logs');
        const transcriptDiv = document.getElementById('transcript');
        const micFill = document.getElementById('mic-fill');
        const spkFill = document.getElementById('spk-fill');
        const statsDiv = document.getElementById('stats');
        const statusDot = document.getElementById('statusDot');
        let statsTimer = null;

        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.className = `log-${type}`;
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(el);
            logDiv.scrollTop = logDiv.scrollHeight;
            while (logDiv.children.length > 300) logDiv.removeChild(logDiv.firstChild);
        }

        function addTranscript(role, text) {
            const el = document.createElement('div');
            el.className = `t-${role}`;
            const prefix = role === 'user' ? 'You' : role === 'agent' ? 'Agent' : '';
            el.textContent = prefix ? `${prefix}: ${text}` : text;
            transcriptDiv.appendChild(el);
            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        }

        function updateStats() {
            statsDiv.textContent =
                `bin_rx=${stats.binaryMsgsRx} (${(stats.binaryBytesRx / 1024).toFixed(1)}KB) | ` +
                `text_rx=${stats.textMsgsRx} | mic_tx=${stats.audioChunksTx} | ` +
                `pcm_played=${stats.pcmChunksPlayed} | errs=${stats.playErrors}`;
        }

        function setStatus(text, state) {
            document.getElementById('status').textContent = text;
            statusDot.className = `status-dot ${state}`;
        }

        // ============================================================
        // LOAD TENANTS FROM API
        // ============================================================
        async function loadTenants() {
            try {
                const resp = await fetch(`${window.location.protocol}//${window.location.host}/tenants`);
                const data = await resp.json();
                const select = document.getElementById('tenantSelect');
                select.innerHTML = '';
                (data.tenants || []).forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    select.appendChild(opt);
                });
            } catch (e) {
                log(`Failed to load tenants: ${e.message}`, 'err');
                document.getElementById('tenantSelect').innerHTML =
                    '<option value="barber_shop_demo">barber_shop_demo</option>';
            }
        }
        loadTenants();

        // ============================================================
        // PCM16 LE -> Float32 + schedule playback
        // ============================================================
        function playPCM16(rawBytes) {
            // rawBytes is a Uint8Array — may NOT be 2-byte aligned,
            // so we must copy into an aligned ArrayBuffer first.
            const aligned = new ArrayBuffer(rawBytes.length);
            new Uint8Array(aligned).set(rawBytes);

            const numSamples = aligned.byteLength / 2;
            const int16 = new Int16Array(aligned);

            // Create an AudioBuffer and fill with float samples
            const buf = audioCtx.createBuffer(1, numSamples, ELEVENLABS_SAMPLE_RATE);
            const ch = buf.getChannelData(0);
            for (let i = 0; i < numSamples; i++) {
                ch[i] = int16[i] / 32768.0;
            }

            // Schedule gapless playback
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            const start = Math.max(now + 0.01, nextPlayTime);
            src.start(start);
            nextPlayTime = start + buf.duration;

            stats.pcmChunksPlayed++;

            // Visualize
            spkFill.style.width = '80%';
            setTimeout(() => spkFill.style.width = '0%', 150);
        }

        // ============================================================
        // START CALL
        // ============================================================
        async function startCall() {
            // 1. Audio Context (default sample rate — browser resamples from 16kHz automatically)
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                log(`AudioContext: sampleRate=${audioCtx.sampleRate}`, 'info');
            } catch (e) {
                log(`AudioContext error: ${e.message}`, 'err');
                return;
            }

            // 2. Reset state
            nextPlayTime = 0;
            stats = { binaryMsgsRx: 0, binaryBytesRx: 0, textMsgsRx: 0, audioChunksTx: 0, pcmChunksPlayed: 0, playErrors: 0 };
            transcriptDiv.innerHTML = '';
            statsTimer = setInterval(updateStats, 1000);

            // 3. WebSocket
            const tenant = document.getElementById('tenantSelect').value;
            const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProto}//${window.location.host}/ws/call/${tenant}?customer_phone=test`;
            log(`Connecting to: ${wsUrl}`, 'info');
            setStatus('Connecting...', 'connecting');

            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                console.log('[WS] onopen');
                setStatus('Connected', 'connected');
                document.getElementById('btnConnect').disabled = true;
                document.getElementById('btnDisconnect').disabled = false;
                log('WebSocket connected', 'info');
                startMic();
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    const buffer = event.data;
                    const u8 = new Uint8Array(buffer);
                    stats.binaryMsgsRx++;
                    stats.binaryBytesRx += buffer.byteLength;

                    if (u8.length < 2) return;

                    const tag = u8[0];
                    const payload = u8.slice(1);

                    if (tag === 0x02) {
                        // Raw PCM16 LE from ElevenLabs — play directly
                        try {
                            playPCM16(payload);
                            if (stats.pcmChunksPlayed <= 5) {
                                console.log(`[AUDIO] PCM16 chunk: ${payload.byteLength}B = ${payload.byteLength/2} samples`);
                                log(`[PCM16] ${payload.byteLength}B = ${payload.byteLength/2} samples`, 'rx');
                            }
                        } catch (e) {
                            stats.playErrors++;
                            console.error('[AUDIO] Play error:', e);
                            log(`Play error: ${e.message}`, 'err');
                        }

                    } else if (tag === 0x01) {
                        console.log(`[AUDIO] OGG chunk: ${payload.byteLength}B`);
                        log(`[OGG] ${payload.byteLength}B (PersonaPlex format)`, 'rx');

                    } else {
                        console.log(`[BIN] Unknown tag=0x${tag.toString(16)} ${payload.byteLength}B`);
                        log(`[BIN] tag=0x${tag.toString(16)} ${payload.byteLength}B`, 'rx');
                    }
                } else {
                    // JSON text message
                    stats.textMsgsRx++;
                    try {
                        const data = JSON.parse(event.data);
                        console.log('[WS] JSON message:', data.type, data);

                        if (data.type === 'transcript') {
                            const role = data.role || 'agent';
                            addTranscript(role, data.content);
                            log(`[${role.toUpperCase()}] ${data.content}`, 'rx');
                        } else if (data.type === 'connected') {
                            addTranscript('system', `Session: ${data.session_id}`);
                            log(`Session: ${data.session_id}`, 'info');
                        } else if (data.type === 'ready') {
                            addTranscript('system', 'Ready — start speaking!');
                            log('Voice bridge ready', 'info');
                        } else if (data.type === 'error') {
                            console.error('[WS] Error from server:', data);
                            addTranscript('system', `Error: ${data.message}`);
                            log(`Error: ${data.message}`, 'err');
                        } else if (data.type === 'conversation_ended') {
                            console.log('[WS] Conversation ended normally');
                            addTranscript('system', 'Conversation ended.');
                            log('Conversation ended', 'info');
                        } else {
                            log(`MSG: ${JSON.stringify(data)}`, 'rx');
                        }
                    } catch (e) {
                        console.log('[WS] Non-JSON text:', event.data);
                        log(`Text: ${event.data}`, 'rx');
                    }
                }
            };

            ws.onclose = (e) => {
                console.warn(`[WS] onclose: code=${e.code} reason=${e.reason} wasClean=${e.wasClean}`);
                log(`WS closed: code=${e.code} reason=${e.reason || 'none'} clean=${e.wasClean}`, 'info');
                stopCall();
            };

            ws.onerror = (e) => {
                console.error('[WS] onerror:', e);
                log('WS error', 'err');
            };
        }

        // ============================================================
        // MICROPHONE
        // ============================================================
        async function startMic() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('Mic access granted', 'info');

                // Mic level visualization
                const micCtx = new AudioContext();
                const source = micCtx.createMediaStreamSource(mediaStream);
                const analyser = micCtx.createAnalyser();
                source.connect(analyser);
                visualizeMic(analyser);

                // Record WebM/Opus and send to server
                recorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });
                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
                        stats.audioChunksTx++;
                        ws.send(e.data);
                    }
                };
                recorder.onerror = (e) => {
                    console.error('[RECORDER] error:', e);
                    log(`Recorder error: ${e.error?.message || 'unknown'}`, 'err');
                };
                recorder.onstop = () => {
                    console.warn('[RECORDER] stopped');
                };
                recorder.start(100); // 100ms chunks
                log('Mic streaming (100ms chunks)', 'info');

            } catch (e) {
                log(`Mic error: ${e.message}`, 'err');
            }
        }

        // ============================================================
        // STOP CALL
        // ============================================================
        function stopCall() {
            if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
            updateStats();

            if (ws) { try { ws.close(); } catch (e) {} ws = null; }
            if (recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch (e) {} }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }

            setStatus('Disconnected', '');
            document.getElementById('btnConnect').disabled = false;
            document.getElementById('btnDisconnect').disabled = true;
            addTranscript('system', 'Call ended.');
        }

        // ============================================================
        // MIC VISUALIZER
        // ============================================================
        function visualizeMic(analyser) {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            function draw() {
                if (!mediaStream || !mediaStream.active) return;
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                const vol = dataArray.reduce((a, b) => a + b) / dataArray.length;
                micFill.style.width = Math.min(vol * 2, 100) + '%';
            }
            draw();
        }
    </script>
</body>

</html>
